<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1F4E5F">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nomad Budget">
    <title>Nomad Budget</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #F3F5F2; }
        @media (prefers-color-scheme: dark) { html, body { background: #131716; } }
        #root { width: 100%; height: 100%; }
    </style>
    <script type="application/javascript" src="composeApp.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () {});
            });
        }
    </script>
</head>
<body>
<div id="root"></div>
</body>
</html>
