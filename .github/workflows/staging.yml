name: Staging

on:
  push:
    branches: [main, stage0/staging-deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Guard against prod
        run: |
          set -euo pipefail
          if [ -z "$PROJECT_REF" ] || [ "$PROJECT_REF" = "gncrjdgznnriuhyuatcv" ]; then
            echo "::error::STAGING_PROJECT_REF пуст или указывает на прод"
            exit 1
          fi
      - name: Migrations to staging
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

  web:
    needs: db
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOMAD_ENV: staging
      NOMAD_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      NOMAD_SUPABASE_KEY: ${{ vars.STAGING_SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build staging web
        run: ./gradlew :composeApp:wasmJsBrowserDistribution
      - name: Publish to nomad-budget-staging
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/staging_deploy
          chmod 600 ~/.ssh/staging_deploy
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/staging_deploy -o IdentitiesOnly=yes"
          out="$RUNNER_TEMP/site"
          git clone --depth 1 git@github.com:Nikita-kut/nomad-budget-staging.git "$out"
          find "$out" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R composeApp/build/dist/wasmJs/productionExecutable/. "$out/"
          touch "$out/.nojekyll"
          printf '# Nomad Budget — staging\n\nСборка из %s, только тестовые данные.\n' "$GITHUB_SHA" > "$out/README.md"
          cd "$out"
          git config user.name "nomad-budget-ci"
          git config user.email "nomad-budget-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Staging build ${GITHUB_SHA::7}" || { echo "Без изменений"; exit 0; }
          git push -q origin HEAD:main
