name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests
        run: ./gradlew :composeApp:testAndroidHostTest :composeApp:wasmJsBrowserTest
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NOMAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета NOMAD_KEYSTORE_BASE64 — релизный APK без постоянной подписи не выпускаем"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "NOMAD_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK and web bundle
        env:
          NOMAD_VERSION: ${{ github.ref_name }}
          NOMAD_KEYSTORE_PASSWORD: ${{ secrets.NOMAD_KEYSTORE_PASSWORD }}
          NOMAD_KEY_ALIAS: ${{ secrets.NOMAD_KEY_ALIAS }}
          NOMAD_KEY_PASSWORD: ${{ secrets.NOMAD_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease :composeApp:wasmJsBrowserDistribution
      - name: Verify APK signature
        env:
          EXPECTED_SHA256: ${{ vars.APK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          expected=$(echo "$EXPECTED_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Отпечаток подписи APK $actual не совпадает с переменной APK_CERT_SHA256"
            exit 1
          fi
      - name: Package artifacts
        run: |
          mkdir -p out
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "out/nomad-budget-${GITHUB_REF_NAME}.apk"
          (cd composeApp/build/dist/wasmJs/productionExecutable && zip -qr "../../../../../out/nomad-budget-web-${GITHUB_REF_NAME}.zip" .)
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: out/*
