name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew :composeApp:testAndroidHostTest :composeApp:wasmJsBrowserTest
      - name: Build APK and web bundle
        run: ./gradlew :androidApp:assembleDebug :composeApp:wasmJsBrowserDistribution
      - name: Package artifacts
        run: |
          mkdir -p out
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "out/nomad-budget-${GITHUB_REF_NAME}.apk"
          (cd composeApp/build/dist/wasmJs/productionExecutable && zip -qr "../../../../../out/nomad-budget-web-${GITHUB_REF_NAME}.zip" .)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/*
