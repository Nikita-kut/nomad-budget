name: Failure alerts

on:
  workflow_run:
    workflows:
      - Check
      - Staging
      - Nightly checks
      - Fetch exchange rates
      - Bank rate watch
      - Backfill exchange rates
      - Release
      - Deploy web to GitHub Pages
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Telegram to owner
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.OWNER_TELEGRAM_CHAT_ID }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [ -z "$CHAT_ID" ]; then
            echo "::warning::Нет OWNER_TELEGRAM_CHAT_ID — оповещение не отправлено"
            exit 0
          fi
          text="Упал workflow «${NAME}»: ${URL}"
          curl -sf -o /dev/null "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "text=${text}" --data-urlencode "disable_web_page_preview=true"
