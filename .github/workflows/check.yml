name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checklist:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: PR quality checklist
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed.txt"
          python3 tools/quality/check_pr_checklist.py < "$RUNNER_TEMP/changed.txt"
      - name: Migration guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          git diff --name-status "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changes.txt"
          python3 tools/quality/check_migrations.py < "$RUNNER_TEMP/changes.txt"

  db:
    if: ${{ !contains(fromJSON('["edited", "labeled", "unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start ephemeral Supabase (migrations from scratch)
        run: supabase start -x studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Database checks (catalog, isolation, foreign refs, functions, anon)
        run: bash supabase/tests/run.sh

  check:
    if: ${{ !contains(fromJSON('["edited", "labeled", "unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Project rules
        run: bash tools/check_rules.sh
      - name: Worker unit tests
        run: python3 -m unittest tools/rates/test_bank_watch.py tools/rates/test_bank_widgets.py tools/rates/test_backfill_rates.py tools/quality/test_check_pr_checklist.py tools/quality/test_check_migrations.py
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Webhook unit tests
        run: node --test supabase/functions/telegram-webhook/*_test.ts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests (JVM + Wasm in headless Chrome)
        run: ./gradlew :composeApp:testAndroidHostTest :composeApp:wasmJsBrowserTest --continue
      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: composeApp/build/reports/tests
          retention-days: 7
